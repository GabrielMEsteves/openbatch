# Replace both addresses with PRIVATE IPs from the same OCI VCN.
# Run Ansible on VM 1 (the existing OpenBatch machine).
[lab_controller]
portal ansible_connection=local ansible_host=10.0.0.10

[lab_workers]
worker1 ansible_host=10.0.0.20 ansible_user=ubuntu ansible_ssh_private_key_file=/home/ubuntu/.ssh/openbatch-provision

[lab_cluster:children]
lab_controller
lab_workers

[lab_cluster:vars]
ansible_python_interpreter=/usr/bin/python3
slurm_lab_user=pesquisador
slurm_lab_uid=2000
slurm_lab_gid=2000
