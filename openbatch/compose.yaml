services:
  backend:
    image: openbatch-backend:local
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      NODE_ENV: production
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      ENABLE_DEV_LOGIN: ${ENABLE_DEV_LOGIN:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      UPLOAD_MAX_SIZE_MB: ${UPLOAD_MAX_SIZE_MB:-50}
      SLURM_SSH_HOST: ${SLURM_SSH_HOST:?Defina o host SSH do cluster}
      SLURM_SSH_KEY_DIR: /run/slurm-ssh
      SLURM_SSH_KNOWN_HOSTS: /run/slurm-ssh/known_hosts
      OPENBATCH_JOB_STORE: /var/lib/openbatch/podman-jobs
    volumes:
      - ${SLURM_SSH_MOUNT:?Defina a pasta com chaves e known_hosts}:/run/slurm-ssh:ro
      - podman-job-records:/var/lib/openbatch/podman-jobs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    tmpfs:
      - /tmp:size=512m,mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - openbatch

  frontend:
    image: openbatch-frontend:local
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - openbatch

networks:
  openbatch:
    driver: bridge

volumes:
  podman-job-records:
